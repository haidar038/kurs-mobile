<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Pesan</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        </style>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-white h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- HEADER -->
            <header class="pt-8 px-6 pb-2 bg-white sticky top-0 z-20">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl font-extrabold text-brand-dark">Pesan 💬</h1>
                    <button class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-slate-700 hover:bg-brand-light hover:text-brand-purple transition">
                        <i class="ph-bold ph-pencil-simple-line text-xl"></i>
                    </button>
                </div>

                <!-- Search -->
                <div class="relative mb-4">
                    <i class="ph-bold ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input
                        type="text"
                        placeholder="Cari nama driver..."
                        class="w-full pl-11 pr-4 py-3 bg-gray-50 rounded-2xl border border-transparent focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 transition-all text-sm font-semibold outline-none"
                    />
                </div>
            </header>

            <!-- CONTENT -->
            <main class="flex-1 px-6 pt-2 pb-24 overflow-y-auto no-scrollbar space-y-6">
                <!-- SECTION: ACTIVE (Sedang Berjalan) -->
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 ml-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-brand-lime animate-pulse"></span>
                        Pickup Aktif
                    </h3>

                    <!-- Chat Item (Active) -->
                    <a href="chat_room.html" class="block bg-brand-light border border-brand-purple/20 p-4 rounded-3xl relative hover:bg-purple-50 transition group">
                        <div class="flex items-center gap-4">
                            <div class="relative">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Driver1" class="w-14 h-14 rounded-full bg-white border-2 border-white shadow-sm" />
                                <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-baseline mb-1">
                                    <h4 class="font-bold text-slate-800 text-sm truncate">Pak Asep Surasep</h4>
                                    <span class="text-[10px] font-bold text-brand-purple">Baru saja</span>
                                </div>
                                <p class="text-xs text-slate-600 truncate font-medium">Oke siap kak, saya meluncur kesana ya 🛵</p>

                                <!-- Context Tag -->
                                <div class="mt-2 flex items-center gap-1 text-[10px] text-gray-500"><i class="ph-fill ph-package"></i> Pickup Sasa • Menuju Lokasi</div>
                            </div>
                        </div>

                        <!-- Unread Badge -->
                        <div class="absolute top-4 right-4 w-3 h-3 bg-brand-purple rounded-full"></div>
                    </a>
                </div>

                <!-- SECTION: HISTORY (Riwayat) -->
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 ml-2">Riwayat Chat</h3>
                    <div class="space-y-2">
                        <!-- Chat Item -->
                        <div class="flex items-center gap-4 p-3 rounded-2xl hover:bg-gray-50 transition cursor-pointer group">
                            <div class="relative">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Driver2" class="w-12 h-12 rounded-full bg-gray-100" />
                            </div>
                            <div class="flex-1 min-w-0 border-b border-gray-50 pb-3 group-hover:border-transparent">
                                <div class="flex justify-between items-baseline mb-1">
                                    <h4 class="font-bold text-slate-700 text-sm truncate">Mas Budi Tosa</h4>
                                    <span class="text-[10px] text-gray-400">Kemarin</span>
                                </div>
                                <p class="text-xs text-gray-400 truncate">Makasih ya kak, bintang 5 nya!</p>
                            </div>
                        </div>

                        <!-- Chat Item -->
                        <div class="flex items-center gap-4 p-3 rounded-2xl hover:bg-gray-50 transition cursor-pointer group">
                            <div class="relative">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=CS" class="w-12 h-12 rounded-full bg-brand-purple/10 p-1" />
                            </div>
                            <div class="flex-1 min-w-0 border-b border-gray-50 pb-3 group-hover:border-transparent">
                                <div class="flex justify-between items-baseline mb-1">
                                    <h4 class="font-bold text-slate-700 text-sm truncate">CS Jaga Bumi</h4>
                                    <span class="text-[10px] text-gray-400">12 Feb</span>
                                </div>
                                <p class="text-xs text-gray-400 truncate">Laporan #8821 sudah kami proses ya...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Placeholder Bottom Nav -->
            <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-20">
                <i class="ph-bold ph-house text-2xl text-gray-300"></i>
                <i class="ph-bold ph-clock-counter-clockwise text-2xl text-gray-300"></i>
                <div class="w-12"></div>
                <div class="flex flex-col items-center gap-1 text-brand-purple">
                    <i class="ph-fill ph-chat-circle-text text-2xl"></i>
                    <span class="text-[10px] font-bold">Pesan</span>
                </div>
                <i class="ph-bold ph-user text-2xl text-gray-300"></i>
            </nav>

            <!-- FAB Placeholder -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-16 h-16 bg-brand-dark rounded-full border-4 border-white shadow-xl flex items-center justify-center z-30">
                <i class="ph-fill ph-map-trifold text-3xl text-brand-lime"></i>
            </div>
        </div>
    </body>
</html>
