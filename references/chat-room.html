<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Chat Room</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            /* Chat Bubble Tails */
            .bubble-me {
                border-bottom-right-radius: 4px;
            }
            .bubble-you {
                border-top-left-radius: 4px;
            }
        </style>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-white h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- HEADER (Driver Info & Call) -->
            <header class="pt-8 px-4 pb-4 bg-white border-b border-gray-50 flex items-center justify-between z-20 shadow-sm">
                <div class="flex items-center gap-3">
                    <button onclick="history.back()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-slate-700 transition">
                        <i class="ph-bold ph-arrow-left text-lg"></i>
                    </button>
                    <div class="relative">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Driver1" class="w-10 h-10 rounded-full bg-gray-100 border border-gray-200" />
                        <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"></div>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm text-slate-800 flex items-center gap-1">
                            Pak Asep
                            <i class="ph-fill ph-star text-yellow-400 text-xs"></i> 4.9
                        </h1>
                        <p class="text-[10px] text-gray-500 font-medium">Viar Karya • B 1234 XYZ</p>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button class="w-9 h-9 rounded-full bg-green-50 text-green-600 flex items-center justify-center hover:bg-green-100 transition">
                        <i class="ph-fill ph-phone"></i>
                    </button>
                    <button class="w-9 h-9 rounded-full bg-gray-50 text-gray-600 flex items-center justify-center hover:bg-gray-100 transition">
                        <i class="ph-bold ph-dots-three-vertical"></i>
                    </button>
                </div>
            </header>

            <!-- CHAT AREA -->
            <main class="flex-1 px-4 py-4 overflow-y-auto no-scrollbar bg-gray-50 flex flex-col gap-3">
                <!-- System Notice -->
                <div class="flex justify-center mb-2">
                    <span class="bg-gray-200 text-gray-500 text-[10px] font-bold px-3 py-1 rounded-full">Hari ini, 10:23</span>
                </div>

                <!-- Message: Them (Driver) -->
                <div class="flex flex-col items-start max-w-[80%]">
                    <div class="bg-white p-3 rounded-2xl bubble-you shadow-sm text-sm text-slate-700 leading-relaxed border border-gray-100">Halo kak, sesuai aplikasi ya titik jemputnya?</div>
                    <span class="text-[10px] text-gray-400 mt-1 ml-1">10:24</span>
                </div>

                <!-- Message: Me -->
                <div class="flex flex-col items-end max-w-[80%] self-end">
                    <div class="bg-brand-purple text-white p-3 rounded-2xl bubble-me shadow-md shadow-brand-purple/20 text-sm leading-relaxed">Iya pak bener, pagar warna hitam ya.</div>
                    <div class="flex items-center gap-1 mt-1 mr-1">
                        <span class="text-[10px] text-gray-400">10:25</span>
                        <i class="ph-bold ph-checks text-brand-purple text-xs"></i>
                    </div>
                </div>

                <!-- Message: Me (Image) -->
                <div class="flex flex-col items-end max-w-[80%] self-end">
                    <div class="bg-brand-purple p-1 rounded-2xl bubble-me shadow-md shadow-brand-purple/20 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1595278069441-2cf29f8005a4?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80" class="w-full h-32 object-cover rounded-xl" />
                    </div>
                    <div class="flex items-center gap-1 mt-1 mr-1">
                        <span class="text-[10px] text-gray-400">10:25</span>
                        <i class="ph-bold ph-checks text-brand-purple text-xs"></i>
                    </div>
                </div>

                <!-- Message: Them (Typing Indicator) -->
                <div class="flex items-center gap-2 mt-2">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Driver1" class="w-6 h-6 rounded-full grayscale opacity-50" />
                    <div class="bg-gray-200 px-3 py-2 rounded-full flex gap-1 items-center">
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div>
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    </div>
                </div>

                <!-- New Message Slide In -->
                <div class="flex flex-col items-start max-w-[80%] animate-pulse">
                    <div class="bg-white p-3 rounded-2xl bubble-you shadow-sm text-sm text-slate-700 leading-relaxed border border-gray-100">Oke siap kak, saya meluncur kesana ya 🛵</div>
                    <span class="text-[10px] text-gray-400 mt-1 ml-1">Baru saja</span>
                </div>
            </main>

            <!-- FOOTER (Input Area) -->
            <div class="bg-white border-t border-gray-100 p-4 pb-6 z-20">
                <!-- Quick Chips (Scrollable) -->
                <div class="flex gap-2 overflow-x-auto no-scrollbar mb-3">
                    <button class="whitespace-nowrap px-3 py-1.5 rounded-full bg-brand-light text-brand-purple text-xs font-bold border border-brand-purple/10 hover:bg-brand-purple hover:text-white transition">
                        Saya di titik jemput📍
                    </button>
                    <button class="whitespace-nowrap px-3 py-1.5 rounded-full bg-brand-light text-brand-purple text-xs font-bold border border-brand-purple/10 hover:bg-brand-purple hover:text-white transition">Ditunggu ya pak</button>
                    <button class="whitespace-nowrap px-3 py-1.5 rounded-full bg-brand-light text-brand-purple text-xs font-bold border border-brand-purple/10 hover:bg-brand-purple hover:text-white transition">Oke 👍</button>
                </div>

                <!-- Input Bar -->
                <div class="flex items-end gap-2">
                    <button class="w-10 h-10 rounded-full bg-gray-50 text-gray-400 flex items-center justify-center hover:bg-gray-100 hover:text-brand-purple transition shrink-0 mb-1">
                        <i class="ph-bold ph-plus"></i>
                    </button>

                    <div class="flex-1 bg-gray-50 rounded-2xl flex items-center px-4 py-2 border border-transparent focus-within:border-brand-purple/30 focus-within:bg-white transition">
                        <textarea placeholder="Ketik pesan..." rows="1" class="w-full bg-transparent text-sm outline-none resize-none max-h-24 pt-1.5 text-slate-700 placeholder-gray-400"></textarea>
                        <button class="ml-2 text-gray-400 hover:text-brand-purple transition">
                            <i class="ph-bold ph-camera"></i>
                        </button>
                    </div>

                    <button class="w-12 h-12 rounded-full bg-brand-lime text-brand-dark flex items-center justify-center shadow-lg hover:scale-105 transition shrink-0 mb-0.5">
                        <i class="ph-fill ph-paper-plane-right text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
