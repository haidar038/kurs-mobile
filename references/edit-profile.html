<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Edit Profil</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        </style>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-white h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- HEADER -->
            <header class="pt-8 px-6 pb-4 bg-white sticky top-0 z-20 flex items-center justify-between">
                <button onclick="history.back()" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-slate-700 transition">
                    <i class="ph-bold ph-arrow-left text-lg"></i>
                </button>
                <h1 class="text-lg font-bold text-brand-dark">Edit Profil</h1>
                <div class="w-10"></div>
                <!-- Spacer for center alignment -->
            </header>

            <!-- CONTENT -->
            <main class="flex-1 px-6 pt-4 pb-32 overflow-y-auto no-scrollbar">
                <!-- 1. AVATAR UPLOAD SECTION -->
                <div class="flex flex-col items-center mb-8">
                    <div class="relative group cursor-pointer">
                        <!-- Avatar Image -->
                        <div class="w-28 h-28 rounded-full border-4 border-gray-50 shadow-lg overflow-hidden relative">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Darox" class="w-full h-full object-cover group-hover:opacity-80 transition" />

                            <!-- Overlay on Hover (Desktop) / Click (Mobile) -->
                            <div class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center transition">
                                <i class="ph-bold ph-camera text-white text-2xl"></i>
                            </div>
                        </div>

                        <!-- Edit Badge -->
                        <button class="absolute bottom-1 right-1 w-8 h-8 bg-brand-lime border-2 border-white rounded-full flex items-center justify-center text-brand-dark shadow-md hover:scale-110 transition">
                            <i class="ph-bold ph-pencil-simple text-sm"></i>
                        </button>
                    </div>
                    <p class="mt-3 text-xs font-bold text-brand-purple cursor-pointer hover:underline">Ubah Foto Profil</p>
                </div>

                <!-- 2. FORM FIELDS -->
                <form action="#" class="space-y-5">
                    <!-- Name Field -->
                    <div class="group">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1">Nama Lengkap</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="ph-bold ph-user text-gray-400 group-focus-within:text-brand-purple transition-colors"></i>
                            </div>
                            <input
                                type="text"
                                value="Darox"
                                class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-transparent rounded-2xl text-sm font-semibold text-slate-800 focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 transition-all outline-none"
                            />
                            <!-- Clear Button (Visible only when typing usually, simplified here) -->
                            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-red-500">
                                <i class="ph-fill ph-x-circle"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Email Field (Read Only) -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5 ml-1">
                            <label class="block text-xs font-bold text-gray-500">Email Address</label>
                            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-green-50 border border-green-100 text-[10px] font-bold text-green-600"> <i class="ph-fill ph-check-circle"></i> Terverifikasi </span>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="ph-bold ph-envelope-simple text-gray-400"></i>
                            </div>
                            <input type="email" value="etercode30@gmail.com" readonly class="w-full pl-11 pr-10 py-3.5 bg-gray-100 border border-transparent rounded-2xl text-sm font-semibold text-gray-500 cursor-not-allowed select-none" />
                            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                                <i class="ph-bold ph-lock-key text-gray-400"></i>
                            </div>
                        </div>
                        <p class="mt-2 text-[10px] text-gray-400 flex items-start gap-1">
                            <i class="ph-fill ph-info mt-0.5"></i>
                            Hubungi CS jika ingin mengubah email terdaftar.
                        </p>
                    </div>

                    <!-- Bio/About Field (Added for Gen Z Expression) -->
                    <div class="group">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1">Bio Singkat</label>
                        <div class="relative">
                            <textarea
                                placeholder="Ceritakan misi lingkunganmu..."
                                class="w-full p-4 bg-gray-50 border border-transparent rounded-2xl text-sm font-medium text-slate-800 focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 transition-all outline-none resize-none h-24"
                            ></textarea>
                            <div class="absolute bottom-3 right-3 text-[10px] text-gray-400">0/150</div>
                        </div>
                    </div>
                </form>
            </main>

            <!-- 3. STICKY ACTION BUTTON -->
            <div class="absolute bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 pb-6 z-30 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
                <button class="w-full bg-brand-purple text-white font-bold text-lg py-3.5 rounded-2xl shadow-lg shadow-brand-purple/30 hover:bg-purple-800 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                    <i class="ph-bold ph-floppy-disk"></i>
                    Simpan Perubahan
                </button>
            </div>
        </div>
    </body>
</html>
