<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Profil</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                                danger: "#FF4D4D",
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        </style>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-white h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- HEADER BACKGROUND -->
            <div class="absolute top-0 w-full h-40 bg-gradient-to-r from-brand-purple to-purple-800 z-0 rounded-b-[40px]"></div>

            <!-- HEADER CONTENT -->
            <header class="pt-12 px-6 relative z-10 flex flex-col items-center text-center">
                <!-- Title -->
                <h1 class="text-white font-bold text-lg mb-6">Profil Saya</h1>

                <!-- Avatar & Badge -->
                <div class="relative mb-3 group">
                    <div class="w-24 h-24 rounded-full border-4 border-white shadow-xl overflow-hidden bg-white">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Darox" alt="Avatar" class="w-full h-full object-cover" />
                    </div>
                    <!-- Edit Button (Small) -->
                    <button class="absolute bottom-0 right-0 w-8 h-8 bg-brand-lime border-2 border-white rounded-full flex items-center justify-center shadow-md text-brand-dark hover:scale-110 transition">
                        <i class="ph-bold ph-pencil-simple text-sm"></i>
                    </button>
                </div>

                <!-- Name & Identity -->
                <h2 class="text-xl font-extrabold text-slate-800">Darox</h2>
                <p class="text-sm text-gray-400 mb-2">etercode30@gmail.com</p>

                <!-- Gamification Badge -->
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-brand-light rounded-full border border-brand-purple/20">
                    <i class="ph-fill ph-shield-check text-brand-purple"></i>
                    <span class="text-xs font-bold text-brand-purple">Warga • Level 3</span>
                </div>
            </header>

            <!-- SCROLLABLE SETTINGS -->
            <main class="flex-1 px-6 pt-6 pb-24 overflow-y-auto no-scrollbar space-y-6">
                <!-- UPGRADE BANNER (Replacement for big buttons) -->
                <div class="bg-gradient-to-r from-blue-600 to-blue-500 rounded-2xl p-4 text-white shadow-lg shadow-blue-500/20 relative overflow-hidden group cursor-pointer">
                    <div class="absolute right-0 top-0 w-24 h-24 bg-white/10 rounded-full blur-xl -mr-10 -mt-10"></div>
                    <div class="relative z-10 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-sm mb-1">Gabung Mitra / Staff</h3>
                            <p class="text-[10px] text-blue-100 max-w-[200px] leading-relaxed">Dapat penghasilan tambahan dengan jadi kolektor atau pengelola.</p>
                        </div>
                        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm group-hover:scale-110 transition">
                            <i class="ph-bold ph-caret-right text-white"></i>
                        </div>
                    </div>
                </div>

                <!-- Group 1: Akun -->
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 ml-2">Pengaturan Akun</h3>
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <!-- Item -->
                        <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition border-b border-gray-50 group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-purple-50 text-brand-purple flex items-center justify-center">
                                    <i class="ph-bold ph-user"></i>
                                </div>
                                <span class="text-sm font-semibold text-slate-700">Data Personal</span>
                            </div>
                            <i class="ph-bold ph-caret-right text-gray-300 group-hover:text-brand-purple transition"></i>
                        </button>

                        <!-- Item -->
                        <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition border-b border-gray-50 group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-purple-50 text-brand-purple flex items-center justify-center">
                                    <i class="ph-bold ph-phone"></i>
                                </div>
                                <span class="text-sm font-semibold text-slate-700">Nomor HP</span>
                            </div>
                            <i class="ph-bold ph-caret-right text-gray-300 group-hover:text-brand-purple transition"></i>
                        </button>

                        <!-- Item -->
                        <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-purple-50 text-brand-purple flex items-center justify-center">
                                    <i class="ph-bold ph-lock-key"></i>
                                </div>
                                <span class="text-sm font-semibold text-slate-700">Keamanan</span>
                            </div>
                            <i class="ph-bold ph-caret-right text-gray-300 group-hover:text-brand-purple transition"></i>
                        </button>
                    </div>
                </div>

                <!-- Group 2: Info -->
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 ml-2">Pusat Bantuan</h3>
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <!-- Item -->
                        <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition border-b border-gray-50 group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-gray-50 text-gray-500 flex items-center justify-center group-hover:text-brand-purple transition">
                                    <i class="ph-bold ph-question"></i>
                                </div>
                                <span class="text-sm font-semibold text-slate-700">Bantuan & CS</span>
                            </div>
                            <i class="ph-bold ph-caret-right text-gray-300 group-hover:text-brand-purple transition"></i>
                        </button>

                        <!-- Item -->
                        <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition border-b border-gray-50 group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-gray-50 text-gray-500 flex items-center justify-center group-hover:text-brand-purple transition">
                                    <i class="ph-bold ph-file-text"></i>
                                </div>
                                <span class="text-sm font-semibold text-slate-700">Syarat & Ketentuan</span>
                            </div>
                            <i class="ph-bold ph-caret-right text-gray-300 group-hover:text-brand-purple transition"></i>
                        </button>

                        <!-- Item -->
                        <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-gray-50 text-gray-500 flex items-center justify-center group-hover:text-brand-purple transition">
                                    <i class="ph-bold ph-shield"></i>
                                </div>
                                <span class="text-sm font-semibold text-slate-700">Kebijakan Privasi</span>
                            </div>
                            <i class="ph-bold ph-caret-right text-gray-300 group-hover:text-brand-purple transition"></i>
                        </button>
                    </div>
                </div>

                <!-- Logout Button -->
                <button class="w-full py-3 rounded-2xl border-2 border-red-50 text-red-500 font-bold text-sm hover:bg-red-50 transition flex items-center justify-center gap-2">
                    <i class="ph-bold ph-sign-out"></i>
                    Keluar Akun
                </button>

                <!-- Version Info -->
                <p class="text-center text-[10px] text-gray-300 font-mono pt-4">Jaga Bumi v2.1.0 (Build 402)</p>
            </main>

            <!-- Placeholder Bottom Nav -->
            <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-20">
                <i class="ph-bold ph-house text-2xl text-gray-300"></i>
                <i class="ph-bold ph-clock-counter-clockwise text-2xl text-gray-300"></i>
                <div class="w-12"></div>
                <i class="ph-bold ph-book-open text-2xl text-gray-300"></i>
                <div class="flex flex-col items-center gap-1 text-brand-purple">
                    <i class="ph-fill ph-user text-2xl"></i>
                    <span class="text-[10px] font-bold">Akun</span>
                </div>
            </nav>

            <!-- FAB Placeholder -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-16 h-16 bg-brand-dark rounded-full border-4 border-white shadow-xl flex items-center justify-center z-30">
                <i class="ph-fill ph-map-trifold text-3xl text-brand-lime"></i>
            </div>
        </div>
    </body>
</html>
