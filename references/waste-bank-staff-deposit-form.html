<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Input Setoran</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            /* Custom Radio Style */
            .type-radio:checked + div {
                border-color: #6a0dad;
                background-color: #f4f1fa;
                color: #6a0dad;
            }
            .type-radio:checked + div .check-circle {
                opacity: 1;
                transform: scale(1);
            }
        </style>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-white h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- HEADER -->
            <header class="pt-8 px-6 pb-2 bg-white sticky top-0 z-20">
                <div class="flex items-center gap-4 mb-4">
                    <button onclick="history.back()" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-slate-700 transition">
                        <i class="ph-bold ph-arrow-left text-lg"></i>
                    </button>
                    <h1 class="text-xl font-extrabold text-brand-dark">Input Setoran</h1>
                </div>
            </header>

            <!-- CONTENT -->
            <main class="flex-1 px-6 pt-2 pb-32 overflow-y-auto no-scrollbar space-y-6">
                <!-- 1. DEPOSITOR PROFILE (Result of QR Scan) -->
                <div class="bg-brand-dark p-4 rounded-3xl text-white relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-24 h-24 bg-brand-purple/50 rounded-full blur-2xl -mr-5 -mt-5"></div>

                    <div class="flex items-center gap-4 relative z-10">
                        <div class="relative">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Darox" class="w-14 h-14 rounded-full border-2 border-white bg-gray-800" />
                            <div class="absolute -bottom-1 -right-1 bg-brand-lime text-brand-dark text-[10px] font-bold px-1.5 rounded-full border border-brand-dark">MEMBER</div>
                        </div>
                        <div class="flex-1">
                            <p class="text-xs text-gray-400">Penyetor</p>
                            <h3 class="text-lg font-bold">Darox</h3>
                            <p class="text-xs text-gray-400">etercode30@gmail.com</p>
                        </div>
                        <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition">
                            <i class="ph-bold ph-qr-code text-white"></i>
                        </button>
                    </div>
                </div>

                <!-- 2. WASTE TYPE GRID -->
                <section>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Jenis Sampah</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <!-- Organik -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="waste_type" class="type-radio hidden" />
                            <div class="bg-white border border-gray-200 rounded-2xl p-3 flex flex-col items-center gap-2 transition hover:border-green-300 relative overflow-hidden h-24 justify-center">
                                <div class="w-8 h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center">
                                    <i class="ph-fill ph-leaf"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-600 group-hover:text-green-600">Organik</span>
                                <i class="ph-fill ph-check-circle text-brand-purple absolute top-2 right-2 opacity-0 check-circle transition transform scale-50"></i>
                            </div>
                        </label>
                        <!-- Plastik -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="waste_type" class="type-radio hidden" checked />
                            <div class="bg-white border border-gray-200 rounded-2xl p-3 flex flex-col items-center gap-2 transition hover:border-blue-300 relative overflow-hidden h-24 justify-center">
                                <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
                                    <i class="ph-fill ph-bottle"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-600 group-hover:text-blue-600">Plastik</span>
                                <i class="ph-fill ph-check-circle text-brand-purple absolute top-2 right-2 opacity-0 check-circle transition transform scale-50"></i>
                            </div>
                        </label>
                        <!-- Kertas -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="waste_type" class="type-radio hidden" />
                            <div class="bg-white border border-gray-200 rounded-2xl p-3 flex flex-col items-center gap-2 transition hover:border-orange-300 relative overflow-hidden h-24 justify-center">
                                <div class="w-8 h-8 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center">
                                    <i class="ph-fill ph-files"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-600 group-hover:text-orange-600">Kertas</span>
                                <i class="ph-fill ph-check-circle text-brand-purple absolute top-2 right-2 opacity-0 check-circle transition transform scale-50"></i>
                            </div>
                        </label>
                        <!-- Logam -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="waste_type" class="type-radio hidden" />
                            <div class="bg-white border border-gray-200 rounded-2xl p-3 flex flex-col items-center gap-2 transition hover:border-gray-400 relative overflow-hidden h-24 justify-center">
                                <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center">
                                    <i class="ph-fill ph-wrench"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-600">Logam</span>
                                <i class="ph-fill ph-check-circle text-brand-purple absolute top-2 right-2 opacity-0 check-circle transition transform scale-50"></i>
                            </div>
                        </label>
                        <!-- Kaca -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="waste_type" class="type-radio hidden" />
                            <div class="bg-white border border-gray-200 rounded-2xl p-3 flex flex-col items-center gap-2 transition hover:border-teal-300 relative overflow-hidden h-24 justify-center">
                                <div class="w-8 h-8 rounded-full bg-teal-50 text-teal-600 flex items-center justify-center">
                                    <i class="ph-fill ph-drop"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-600">Kaca</span>
                                <i class="ph-fill ph-check-circle text-brand-purple absolute top-2 right-2 opacity-0 check-circle transition transform scale-50"></i>
                            </div>
                        </label>
                        <!-- Elektronik -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="waste_type" class="type-radio hidden" />
                            <div class="bg-white border border-gray-200 rounded-2xl p-3 flex flex-col items-center gap-2 transition hover:border-purple-300 relative overflow-hidden h-24 justify-center">
                                <div class="w-8 h-8 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center">
                                    <i class="ph-fill ph-computer-tower"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-600">E-Waste</span>
                                <i class="ph-fill ph-check-circle text-brand-purple absolute top-2 right-2 opacity-0 check-circle transition transform scale-50"></i>
                            </div>
                        </label>
                    </div>
                </section>

                <!-- 3. WEIGHT & CALCULATOR -->
                <section class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Berat (Kg)</label>
                        <div class="relative">
                            <input
                                type="number"
                                placeholder="0"
                                class="w-full p-4 pl-4 pr-12 text-2xl font-bold bg-white border border-gray-200 rounded-2xl focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 outline-none transition"
                                value="30"
                            />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">kg</span>
                        </div>
                    </div>

                    <!-- Auto Calc Poin -->
                    <div class="flex-1 bg-brand-light p-4 rounded-2xl border border-brand-purple/20 flex flex-col justify-center">
                        <p class="text-[10px] text-gray-400 font-bold uppercase">Estimasi Poin</p>
                        <div class="flex items-center gap-2 mt-1">
                            <i class="ph-fill ph-coin text-brand-lime text-xl drop-shadow-sm"></i>
                            <p class="text-2xl font-extrabold text-brand-purple">3.000</p>
                        </div>
                    </div>
                </section>

                <!-- 4. PHOTO EVIDENCE -->
                <section>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Bukti Foto</label>
                    <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                        <button class="w-20 h-20 rounded-2xl border-2 border-dashed border-brand-purple bg-brand-purple/5 flex flex-col items-center justify-center text-brand-purple hover:bg-brand-purple/10 transition shrink-0">
                            <i class="ph-bold ph-camera text-2xl"></i>
                            <span class="text-[10px] font-bold mt-1">Ambil</span>
                        </button>
                        <!-- Preview -->
                        <div class="w-20 h-20 rounded-2xl bg-gray-100 overflow-hidden relative group shrink-0">
                            <img src="https://images.unsplash.com/photo-1605600659908-0ef719419d41" class="w-full h-full object-cover" />
                            <div class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center transition">
                                <i class="ph-bold ph-trash text-white"></i>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 5. NOTE -->
                <section>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Catatan Staff</label>
                    <textarea
                        class="w-full p-4 bg-gray-50 border border-transparent rounded-2xl text-sm font-medium focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 outline-none resize-none h-20"
                        placeholder="Kondisi sampah, dll..."
                    ></textarea>
                </section>
            </main>

            <!-- STICKY SUBMIT -->
            <div class="absolute bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 pb-6 z-30 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
                <button class="w-full bg-brand-purple text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-brand-purple/30 hover:bg-purple-800 active:scale-[0.98] transition flex items-center justify-center gap-2 group">
                    <i class="ph-bold ph-check-circle text-xl"></i>
                    Konfirmasi & Simpan
                </button>
            </div>
        </div>
    </body>
</html>
