<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Peta Fasilitas</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                                orange: "#FF8A00",
                            },
                        },
                        boxShadow: {
                            float: "0 10px 40px -10px rgba(0,0,0,0.15)",
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            /* Pin Pulse Animation */
            @keyframes pulse-ring {
                0% {
                    transform: scale(0.33);
                    opacity: 1;
                }
                80%,
                100% {
                    transform: scale(2);
                    opacity: 0;
                }
            }
            .pin-ring::before {
                content: "";
                position: absolute;
                left: -12px;
                top: -12px;
                height: 48px;
                width: 48px;
                border-radius: 50%;
                background-color: currentColor;
                opacity: 0.4;
                animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
                z-index: -1;
            }
        </style>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-gray-200 h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- 1. MAP LAYER (Background) -->
            <div class="absolute inset-0 z-0 bg-blue-50">
                <!-- Placeholder Map Image (Ternate Style) -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Google_Maps_Logo_2020.svg/2275px-Google_Maps_Logo_2020.svg.png" class="hidden" />
                <!-- Just for ref -->
                <!-- Using a generic map texture for demo -->
                <div
                    class="w-full h-full bg-[url('https://api.mapbox.com/styles/v1/mapbox/streets-v11/static/127.38,0.80,13,0/600x1200?access_token=YOUR_TOKEN')] bg-cover bg-center"
                    style="background-image: url(&quot;https://i.pinimg.com/736x/a6/50/26/a650266b039cb01e4a3b04c852467d02.jpg&quot;)"
                ></div>
            </div>

            <!-- 2. FLOATING TOP BAR -->
            <div class="absolute top-0 w-full p-6 pt-8 z-20 bg-gradient-to-b from-white/90 via-white/50 to-transparent pb-12">
                <!-- Search Input -->
                <div class="flex gap-3 items-center mb-4">
                    <button onclick="history.back()" class="w-12 h-12 rounded-full bg-white shadow-float flex items-center justify-center text-slate-700 hover:text-brand-purple transition">
                        <i class="ph-bold ph-arrow-left text-xl"></i>
                    </button>
                    <div class="flex-1 relative shadow-float rounded-2xl">
                        <i class="ph-bold ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Cari area atau jalan..." class="w-full pl-11 pr-4 py-3.5 bg-white rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-brand-purple/20" />
                    </div>
                </div>

                <!-- Filter Chips (Interactive Legend) -->
                <div class="flex gap-2 overflow-x-auto no-scrollbar">
                    <button class="px-4 py-2 bg-brand-dark text-white rounded-xl text-xs font-bold shadow-md whitespace-nowrap">Semua</button>
                    <button class="px-4 py-2 bg-white text-green-600 rounded-xl text-xs font-bold shadow-sm border border-white hover:border-green-200 whitespace-nowrap flex items-center gap-1">
                        <div class="w-2 h-2 rounded-full bg-green-500"></div>
                        Bank Sampah
                    </button>
                    <button class="px-4 py-2 bg-white text-orange-600 rounded-xl text-xs font-bold shadow-sm border border-white hover:border-orange-200 whitespace-nowrap flex items-center gap-1">
                        <div class="w-2 h-2 rounded-full bg-orange-500"></div>
                        TPS
                    </button>
                </div>
            </div>

            <!-- 3. MAP PINS (Absolute Positioning Simulation) -->
            <div class="absolute inset-0 z-10 pointer-events-none">
                <!-- Pin 1: Bank Sampah (Selected/Active) -->
                <div class="absolute top-[40%] left-[60%] -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-pointer group">
                    <!-- Tooltip (Hidden by default, shown on hover/active) -->
                    <div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-white px-3 py-1.5 rounded-lg shadow-lg text-[10px] font-bold whitespace-nowrap opacity-100 mb-2">
                        Taman Nukila
                        <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-white rotate-45"></div>
                    </div>
                    <!-- Pin Icon -->
                    <div class="relative w-12 h-12 bg-green-500 text-green-500 rounded-full flex items-center justify-center shadow-xl border-4 border-white pin-ring transform hover:scale-110 transition">
                        <i class="ph-fill ph-recycle text-white text-xl"></i>
                    </div>
                </div>

                <!-- Pin 2: TPS (Inactive) -->
                <div class="absolute top-[60%] left-[30%] -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-pointer opacity-90 hover:opacity-100 hover:z-20 transition">
                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg border-2 border-white">
                        <div class="w-8 h-8 bg-orange-500 rounded-full flex items-center justify-center">
                            <i class="ph-fill ph-trash text-white text-sm"></i>
                        </div>
                    </div>
                </div>

                <!-- Pin 3: TPS (Inactive) -->
                <div class="absolute top-[30%] left-[25%] -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-pointer opacity-90">
                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg border-2 border-white">
                        <div class="w-8 h-8 bg-orange-500 rounded-full flex items-center justify-center">
                            <i class="ph-fill ph-trash text-white text-sm"></i>
                        </div>
                    </div>
                </div>

                <!-- User Location (Blue Dot) -->
                <div class="absolute top-[55%] left-[50%] -translate-x-1/2 -translate-y-1/2">
                    <div class="w-16 h-16 bg-blue-500/20 rounded-full flex items-center justify-center animate-pulse">
                        <div class="w-4 h-4 bg-blue-500 border-2 border-white rounded-full shadow-sm"></div>
                    </div>
                </div>
            </div>

            <!-- 4. FLOATING ACTION BUTTONS (Right Side) -->
            <div class="absolute bottom-48 right-4 flex flex-col gap-3 z-20">
                <button class="w-12 h-12 bg-white rounded-2xl shadow-float flex items-center justify-center text-slate-700 hover:text-brand-purple active:scale-95 transition">
                    <i class="ph-bold ph-crosshair text-xl"></i>
                </button>
                <button class="w-12 h-12 bg-white rounded-2xl shadow-float flex items-center justify-center text-slate-700 hover:text-brand-purple active:scale-95 transition">
                    <i class="ph-bold ph-list-bullets text-xl"></i>
                </button>
            </div>

            <!-- 5. BOTTOM CAROUSEL (Location Preview) -->
            <div class="absolute bottom-0 w-full pb-8 pt-4 z-20 overflow-x-auto no-scrollbar pl-6 flex gap-4 snap-x snap-mandatory bg-gradient-to-t from-white/10 to-transparent">
                <!-- Card 1 (Active) -->
                <div class="snap-center shrink-0 w-[85%] bg-white p-4 rounded-3xl shadow-float border border-green-100 flex gap-4 relative overflow-hidden group">
                    <!-- Decorative Bar -->
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-green-500"></div>

                    <div class="w-20 h-20 bg-gray-200 rounded-2xl overflow-hidden shrink-0">
                        <img src="https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover" />
                    </div>

                    <div class="flex-1 min-w-0 flex flex-col justify-between py-1">
                        <div>
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-sm text-slate-800 truncate">Bank Sampah Nukila</h4>
                                <span class="text-[10px] font-bold text-green-600 bg-green-50 px-1.5 py-0.5 rounded ml-2">Buka</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-0.5">7.7 km • Ternate Tengah</p>
                        </div>

                        <div class="flex gap-2 mt-2">
                            <button class="flex-1 bg-brand-dark text-white text-xs font-bold py-2 rounded-xl flex items-center justify-center gap-1 hover:bg-slate-800 transition"><i class="ph-bold ph-navigation-arrow"></i> Navigasi</button>
                            <button class="w-9 bg-gray-50 text-gray-400 rounded-xl flex items-center justify-center hover:bg-gray-100 hover:text-brand-purple transition">
                                <i class="ph-fill ph-info"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="snap-center shrink-0 w-[85%] bg-white p-4 rounded-3xl shadow-float border border-gray-100 flex gap-4 relative overflow-hidden opacity-90 scale-95">
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-brand-orange"></div>

                    <div class="w-20 h-20 bg-gray-200 rounded-2xl overflow-hidden shrink-0">
                        <img src="https://images.unsplash.com/photo-1595278069441-2cf29f8005a4?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover" />
                    </div>

                    <div class="flex-1 min-w-0 flex flex-col justify-between py-1">
                        <div>
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-sm text-slate-800 truncate">TPS Gambesi</h4>
                                <span class="text-[10px] font-bold text-green-600 bg-green-50 px-1.5 py-0.5 rounded ml-2">Buka</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-0.5">1.2 km • Ternate Selatan</p>
                        </div>

                        <div class="flex gap-2 mt-2">
                            <button class="flex-1 bg-gray-100 text-slate-600 text-xs font-bold py-2 rounded-xl flex items-center justify-center gap-1 hover:bg-gray-200 transition">
                                <i class="ph-bold ph-navigation-arrow"></i> Navigasi
                            </button>
                            <button class="w-9 bg-gray-50 text-gray-400 rounded-xl flex items-center justify-center hover:bg-gray-100 hover:text-brand-purple transition">
                                <i class="ph-fill ph-info"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Spacer -->
                <div class="w-2 shrink-0"></div>
            </div>
        </div>
    </body>
</html>
