<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Masuk</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                            },
                        },
                        animation: {
                            float: "float 6s ease-in-out infinite",
                            "fade-up": "fadeUp 0.5s ease-out forwards",
                        },
                        keyframes: {
                            float: {
                                "0%, 100%": { transform: "translateY(0)" },
                                "50%": { transform: "translateY(-10px)" },
                            },
                            fadeUp: {
                                "0%": { opacity: "0", transform: "translateY(10px)" },
                                "100%": { opacity: "1", transform: "translateY(0)" },
                            },
                        },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-white h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- Background Decor -->
            <div class="absolute -top-24 -left-24 w-64 h-64 bg-brand-purple/10 rounded-full blur-3xl"></div>
            <div class="absolute top-1/2 -right-24 w-40 h-40 bg-brand-lime/10 rounded-full blur-3xl"></div>

            <!-- HEADER -->
            <header class="pt-12 px-8 text-center relative z-10">
                <div class="w-20 h-20 mx-auto bg-brand-purple rounded-3xl flex items-center justify-center shadow-xl shadow-brand-purple/20 mb-6 animate-float">
                    <i class="ph-fill ph-planet text-4xl text-brand-lime"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-brand-dark mb-2">Welcome Back! 👋</h1>
                <p class="text-gray-400 text-sm">Lanjutin misi jaga bumi kamu sekarang.</p>
            </header>

            <!-- FORM -->
            <main class="flex-1 px-8 pt-8 pb-4 z-10 flex flex-col justify-center">
                <form action="#" class="space-y-5">
                    <!-- Email -->
                    <div class="group animate-fade-up" style="animation-delay: 0.1s">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="ph-bold ph-envelope-simple text-gray-400 group-focus-within:text-brand-purple transition-colors"></i>
                            </div>
                            <input
                                type="email"
                                placeholder="nama@email.com"
                                class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-transparent rounded-2xl text-sm font-semibold text-slate-800 placeholder-gray-400 focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 transition-all outline-none"
                            />
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="group animate-fade-up" style="animation-delay: 0.2s">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="ph-bold ph-lock-key text-gray-400 group-focus-within:text-brand-purple transition-colors"></i>
                            </div>
                            <input
                                type="password"
                                placeholder="••••••••"
                                class="w-full pl-11 pr-12 py-3.5 bg-gray-50 border border-transparent rounded-2xl text-sm font-semibold text-slate-800 placeholder-gray-400 focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 transition-all outline-none"
                            />
                            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-brand-purple">
                                <i class="ph-bold ph-eye-slash"></i>
                            </button>
                        </div>
                        <div class="text-right mt-2">
                            <a href="#" class="text-xs font-bold text-brand-purple hover:underline">Lupa Password?</a>
                        </div>
                    </div>

                    <!-- Login Button -->
                    <button class="w-full bg-brand-purple text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-brand-purple/30 hover:bg-purple-800 active:scale-[0.98] transition-all animate-fade-up" style="animation-delay: 0.3s">
                        Masuk Sekarang
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative py-6 animate-fade-up" style="animation-delay: 0.4s">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-100"></div>
                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="px-4 bg-white text-gray-400 font-medium">Atau masuk pakai</span>
                    </div>
                </div>

                <!-- Social Login -->
                <button class="w-full py-3.5 rounded-2xl border-2 border-gray-100 bg-white hover:bg-gray-50 flex items-center justify-center gap-3 transition-all animate-fade-up" style="animation-delay: 0.5s">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google" />
                    <span class="font-bold text-slate-600 text-sm">Google Account</span>
                </button>
            </main>

            <!-- FOOTER -->
            <footer class="p-6 text-center z-10">
                <p class="text-sm text-gray-400 font-medium">
                    Belum punya akun?
                    <a href="register.html" class="text-brand-purple font-bold hover:text-brand-lime transition-colors">Daftar dulu</a>
                </p>
            </footer>
        </div>
    </body>
</html>
