<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Splash</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet" />

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                            display: ["Syne", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                            },
                        },
                        animation: {
                            "spin-slow": "spin 8s linear infinite",
                            "pulse-slow": "pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite",
                            float: "float 6s ease-in-out infinite",
                            "fill-bar": "fillBar 2.5s ease-out forwards",
                        },
                        keyframes: {
                            float: {
                                "0%, 100%": { transform: "translateY(0)" },
                                "50%": { transform: "translateY(-10px)" },
                            },
                            fillBar: {
                                "0%": { width: "0%" },
                                "50%": { width: "70%" },
                                "100%": { width: "100%" },
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            /* Custom Orbit Animation */
            .orbit-ring {
                transform-style: preserve-3d;
                animation: rotateOrbit 10s linear infinite;
            }
            @keyframes rotateOrbit {
                from {
                    transform: rotateZ(0deg) rotateX(65deg) rotateZ(0deg);
                }
                to {
                    transform: rotateZ(360deg) rotateX(65deg) rotateZ(-360deg);
                }
            }
        </style>
    </head>
    <body class="bg-brand-dark flex justify-center min-h-screen items-center font-sans overflow-hidden">
        <div class="w-full max-w-md h-screen relative flex flex-col items-center justify-center overflow-hidden shadow-2xl">
            <!-- Background Effects -->
            <div class="absolute top-[-20%] left-[-20%] w-[140%] h-[140%] bg-[radial-gradient(circle_at_center,_#6A0DAD_0%,_transparent_60%)] opacity-20 blur-3xl animate-pulse-slow"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-brand-lime opacity-5 blur-[100px]"></div>

            <!-- LOGO CONTAINER -->
            <div class="relative w-40 h-40 flex items-center justify-center mb-8 animate-float">
                <!-- Planet (Central Sphere) -->
                <div class="absolute w-24 h-24 bg-gradient-to-br from-brand-purple to-purple-900 rounded-full shadow-[0_0_40px_rgba(106,13,173,0.6)] z-10 flex items-center justify-center border-2 border-white/10">
                    <!-- Abstract continents/lines -->
                    <div class="w-full h-full rounded-full opacity-30 overflow-hidden relative">
                        <div class="absolute top-2 left-4 w-12 h-8 bg-white/20 rounded-full blur-md"></div>
                        <div class="absolute bottom-4 right-6 w-8 h-6 bg-white/20 rounded-full blur-md"></div>
                    </div>
                </div>

                <!-- Orbit Ring (Lime) -->
                <div class="absolute w-40 h-40 border-[3px] border-brand-lime/80 rounded-full z-20" style="transform: rotateX(70deg) rotateY(15deg)">
                    <!-- Particle on orbit -->
                    <div class="absolute top-0 left-1/2 w-3 h-3 bg-white rounded-full shadow-[0_0_10px_white] -translate-x-1/2 -translate-y-1/2"></div>
                </div>

                <!-- Orbit Ring (Faint Purple) -->
                <div class="absolute w-32 h-32 border-[1px] border-white/20 rounded-full z-0" style="transform: rotateX(70deg) rotateY(-30deg)"></div>
            </div>

            <!-- TEXT BRANDING -->
            <div class="text-center z-10 space-y-2">
                <h1 class="font-display text-4xl font-extrabold text-white tracking-tight drop-shadow-lg">JAGA BUMI</h1>
                <p class="text-purple-200 text-sm font-medium tracking-widest uppercase opacity-80">Langkah Kecil, Dampak Besar</p>
            </div>

            <!-- LOADING INDICATOR (Bottom) -->
            <div class="absolute bottom-12 w-48 text-center">
                <!-- Progress Bar -->
                <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden mb-3">
                    <div class="h-full bg-brand-lime animate-fill-bar shadow-[0_0_10px_#CCFF00]"></div>
                </div>
                <p class="text-[10px] text-gray-500 font-mono">Memuat Ekosistem v2.0...</p>
            </div>
        </div>

        <script>
            // Simulation: Redirect after loading
            setTimeout(() => {
                // Logic to go to Login/Onboarding
                console.log("Splash finished");
            }, 3000);
        </script>
    </body>
</html>
