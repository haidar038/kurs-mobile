<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Dompet Saya</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            /* Card Glare Effect */
            .glass-shine {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            }
        </style>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-white h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- HEADER -->
            <header class="pt-8 px-6 pb-4 bg-white sticky top-0 z-20 flex items-center gap-4">
                <button onclick="history.back()" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-slate-700 transition">
                    <i class="ph-bold ph-arrow-left text-lg"></i>
                </button>
                <h1 class="text-xl font-extrabold text-brand-dark">Dompet Saya 💳</h1>
            </header>

            <!-- CONTENT -->
            <main class="flex-1 px-6 pt-2 pb-24 overflow-y-auto no-scrollbar space-y-6">
                <!-- 1. MAIN CARD (Saldo Pay) -->
                <section>
                    <div class="bg-brand-dark rounded-3xl p-6 text-white relative overflow-hidden shadow-xl shadow-brand-dark/30 group">
                        <!-- Decor -->
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-brand-purple rounded-full blur-3xl opacity-50"></div>
                        <div class="absolute bottom-0 left-0 w-full h-1/2 glass-shine rounded-b-3xl"></div>

                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-6">
                                <div>
                                    <p class="text-xs font-medium text-gray-400 mb-1">Saldo JagaPay</p>
                                    <h2 class="text-3xl font-extrabold tracking-tight">Rp 50.000</h2>
                                </div>
                                <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-sm">
                                    <i class="ph-fill ph-wallet text-xl text-brand-lime"></i>
                                </div>
                            </div>

                            <div class="flex gap-3">
                                <button class="flex-1 bg-brand-lime text-brand-dark py-2.5 rounded-xl text-xs font-bold hover:bg-white transition flex items-center justify-center gap-2"><i class="ph-bold ph-plus"></i> Top Up</button>
                                <button class="flex-1 bg-white/10 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-white/20 transition flex items-center justify-center gap-2 border border-white/10">
                                    <i class="ph-bold ph-clock-counter-clockwise"></i> History
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 2. SECONDARY CARD (Eco Points) -->
                <section>
                    <div class="bg-brand-light border border-brand-purple/20 rounded-3xl p-5 flex items-center justify-between relative overflow-hidden">
                        <div class="relative z-10">
                            <p class="text-xs font-bold text-brand-purple uppercase tracking-wider mb-1">Eco-Points</p>
                            <h3 class="text-2xl font-extrabold text-brand-dark flex items-center gap-1">2.450 <i class="ph-fill ph-coin text-yellow-400 text-lg"></i></h3>
                            <p class="text-[10px] text-gray-500 mt-1">Setara Rp 2.450</p>
                        </div>

                        <button class="bg-brand-purple text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-brand-purple/20 hover:bg-purple-800 transition flex items-center gap-2 relative z-10">
                            Tukar Poin <i class="ph-bold ph-caret-right"></i>
                        </button>

                        <!-- Background Decor -->
                        <i class="ph-fill ph-plant absolute -right-4 -bottom-4 text-8xl text-brand-purple/5 rotate-[-15deg]"></i>
                    </div>
                </section>

                <!-- 3. ACTIONS GRID -->
                <section>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Layanan Keuangan</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <button class="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-white hover:shadow-sm transition border border-transparent hover:border-gray-100">
                            <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xl">
                                <i class="ph-fill ph-bank"></i>
                            </div>
                            <span class="text-[10px] font-bold text-center text-gray-600">Transfer</span>
                        </button>
                        <button class="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-white hover:shadow-sm transition border border-transparent hover:border-gray-100">
                            <div class="w-12 h-12 rounded-full bg-green-50 text-green-600 flex items-center justify-center text-xl">
                                <i class="ph-fill ph-qr-code"></i>
                            </div>
                            <span class="text-[10px] font-bold text-center text-gray-600">Bayar</span>
                        </button>
                        <button class="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-white hover:shadow-sm transition border border-transparent hover:border-gray-100">
                            <div class="w-12 h-12 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center text-xl">
                                <i class="ph-fill ph-ticket"></i>
                            </div>
                            <span class="text-[10px] font-bold text-center text-gray-600">Voucher</span>
                        </button>
                        <button class="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-white hover:shadow-sm transition border border-transparent hover:border-gray-100">
                            <div class="w-12 h-12 rounded-full bg-purple-50 text-brand-purple flex items-center justify-center text-xl">
                                <i class="ph-fill ph-dots-three"></i>
                            </div>
                            <span class="text-[10px] font-bold text-center text-gray-600">Lainnya</span>
                        </button>
                    </div>
                </section>

                <!-- 4. TRANSACTION HISTORY -->
                <section>
                    <div class="flex justify-between items-end mb-4">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Transaksi Terakhir</h3>
                        <a href="#" class="text-[10px] font-bold text-brand-purple hover:underline">Lihat Semua</a>
                    </div>

                    <div class="space-y-4">
                        <!-- Item 1: Expense (Pickup) -->
                        <div class="flex justify-between items-center group">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center border border-red-100 group-hover:scale-110 transition">
                                    <i class="ph-fill ph-truck"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-sm text-slate-800">Pickup Sampah</h4>
                                    <p class="text-[10px] text-gray-400">Hari Ini, 10:20</p>
                                </div>
                            </div>
                            <span class="font-bold text-sm text-slate-800">-Rp 10.000</span>
                        </div>

                        <!-- Item 2: Reward (Poin) -->
                        <div class="flex justify-between items-center group">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-green-50 text-green-600 flex items-center justify-center border border-green-100 group-hover:scale-110 transition">
                                    <i class="ph-fill ph-recycle"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-sm text-slate-800">Setor Bank Sampah</h4>
                                    <p class="text-[10px] text-gray-400">Kemarin</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="block font-bold text-sm text-green-600">+500 Poin</span>
                                <span class="text-[10px] text-gray-400">Estimasi Rp 500</span>
                            </div>
                        </div>

                        <!-- Item 3: Top Up -->
                        <div class="flex justify-between items-center group">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-100 group-hover:scale-110 transition">
                                    <i class="ph-fill ph-wallet"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-sm text-slate-800">Top Up GoPay</h4>
                                    <p class="text-[10px] text-gray-400">12 Feb 2026</p>
                                </div>
                            </div>
                            <span class="font-bold text-sm text-green-600">+Rp 50.000</span>
                        </div>
                    </div>
                </section>
            </main>

            <!-- Placeholder Bottom Nav (Just to show context) -->
            <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-20">
                <i class="ph-bold ph-house text-2xl text-gray-300"></i>
                <i class="ph-bold ph-clock-counter-clockwise text-2xl text-gray-300"></i>
                <div class="w-12"></div>
                <i class="ph-bold ph-book-open text-2xl text-gray-300"></i>
                <i class="ph-bold ph-user text-2xl text-gray-300"></i>
            </nav>

            <!-- FAB Placeholder -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-16 h-16 bg-brand-dark rounded-full border-4 border-white shadow-xl flex items-center justify-center z-30">
                <i class="ph-fill ph-map-trifold text-3xl text-brand-lime"></i>
            </div>
        </div>
    </body>
</html>
