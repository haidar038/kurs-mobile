<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jaga Bumi - Daftar Akun</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <!-- Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            brand: {
                                purple: "#6A0DAD",
                                lime: "#CCFF00",
                                dark: "#1A1A2E",
                                light: "#F4F1FA",
                            },
                        },
                        animation: {
                            "fade-up": "fadeUp 0.5s ease-out forwards",
                        },
                        keyframes: {
                            fadeUp: {
                                "0%": { opacity: "0", transform: "translateY(10px)" },
                                "100%": { opacity: "1", transform: "translateY(0)" },
                            },
                        },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-gray-50 flex justify-center min-h-screen font-sans text-slate-800 items-center">
        <div class="w-full max-w-md bg-white h-screen flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] border border-gray-100 sm:h-[90vh]">
            <!-- Decorative Background -->
            <div class="absolute -top-20 -right-20 w-64 h-64 bg-brand-lime/10 rounded-full blur-3xl z-0"></div>
            <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-brand-light to-transparent z-0"></div>

            <!-- HEADER -->
            <header class="pt-8 px-6 relative z-10">
                <!-- Back Button -->
                <button class="w-10 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center text-gray-500 hover:text-brand-purple hover:border-brand-purple transition mb-6 shadow-sm">
                    <i class="ph-bold ph-arrow-left text-lg"></i>
                </button>

                <h1 class="text-3xl font-extrabold text-brand-dark tracking-tight">
                    Mulai Aksi Nyata <br />
                    <span class="text-brand-purple relative">
                        Sekarang!
                        <i class="ph-fill ph-sparkle text-brand-lime text-2xl absolute -top-1 -right-6 animate-pulse"></i>
                    </span>
                </h1>
                <p class="text-gray-400 text-sm mt-2">Isi data diri kamu buat gabung komunitas.</p>
            </header>

            <!-- FORM SCROLL AREA -->
            <main class="flex-1 px-6 pt-6 pb-8 overflow-y-auto z-10 no-scrollbar">
                <form action="#" class="space-y-5">
                    <!-- Social Login (The Gen Z Way) -->
                    <button type="button" class="w-full py-3.5 px-4 rounded-2xl border-2 border-gray-100 bg-white hover:bg-gray-50 flex items-center justify-center gap-3 transition-all group active:scale-95">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google" />
                        <span class="font-bold text-slate-600 text-sm group-hover:text-slate-800">Daftar pakai Google</span>
                    </button>

                    <div class="flex items-center gap-4">
                        <div class="h-px bg-gray-100 flex-1"></div>
                        <span class="text-xs text-gray-400 font-medium">atau manual</span>
                        <div class="h-px bg-gray-100 flex-1"></div>
                    </div>

                    <!-- Input: Nama -->
                    <div class="group animate-fade-up" style="animation-delay: 0.1s">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1">Nama Lengkap</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="ph-bold ph-user text-gray-400 group-focus-within:text-brand-purple transition-colors"></i>
                            </div>
                            <input
                                type="text"
                                placeholder="Cth: Dian Sastro"
                                class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-transparent rounded-2xl text-sm font-semibold text-slate-800 placeholder-gray-400 focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 transition-all outline-none"
                            />
                        </div>
                    </div>

                    <!-- Input: Email -->
                    <div class="group animate-fade-up" style="animation-delay: 0.2s">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="ph-bold ph-envelope-simple text-gray-400 group-focus-within:text-brand-purple transition-colors"></i>
                            </div>
                            <input
                                type="email"
                                placeholder="nama@email.com"
                                class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-transparent rounded-2xl text-sm font-semibold text-slate-800 placeholder-gray-400 focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 transition-all outline-none"
                            />
                        </div>
                    </div>

                    <!-- Input: Password -->
                    <div class="group animate-fade-up" style="animation-delay: 0.3s">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="ph-bold ph-lock-key text-gray-400 group-focus-within:text-brand-purple transition-colors"></i>
                            </div>
                            <input
                                type="password"
                                placeholder="Minimal 8 karakter"
                                class="w-full pl-11 pr-12 py-3.5 bg-gray-50 border border-transparent rounded-2xl text-sm font-semibold text-slate-800 placeholder-gray-400 focus:bg-white focus:border-brand-purple focus:ring-4 focus:ring-brand-purple/10 transition-all outline-none"
                            />
                            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-slate-600">
                                <i class="ph-bold ph-eye-slash"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Checkbox Terms -->
                    <div class="flex items-start gap-3 animate-fade-up" style="animation-delay: 0.4s">
                        <div class="flex items-center h-5">
                            <input type="checkbox" class="w-5 h-5 rounded-lg border-2 border-gray-300 text-brand-purple focus:ring-brand-purple/20 transition cursor-pointer" />
                        </div>
                        <label class="text-xs text-gray-500 leading-snug">
                            Saya setuju dengan <a href="#" class="font-bold text-brand-purple hover:underline">Syarat & Ketentuan</a> serta <a href="#" class="font-bold text-brand-purple hover:underline">Kebijakan Privasi</a> Jaga Bumi.
                        </label>
                    </div>
                </form>
            </main>

            <!-- FOOTER / CTA -->
            <div class="p-6 bg-white border-t border-gray-50 z-20">
                <button
                    class="w-full bg-brand-purple text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-brand-purple/30 hover:bg-purple-800 hover:shadow-brand-purple/50 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group"
                >
                    Buat Akun
                    <i class="ph-bold ph-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </button>
                <p class="text-center text-sm text-gray-500 mt-4 font-medium">Udah punya akun? <a href="#" class="text-brand-purple font-bold hover:text-brand-lime transition-colors">Masuk sini</a></p>
            </div>
        </div>
    </body>
</html>
